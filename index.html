<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayersClub GameHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    <div id="app">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">PC</div>
          <div>
            <div class="brand-tag">PlayersClub</div>
            <div class="brand-sub">GameHub</div>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-btn active" data-view="arcade">Arcade</button>
          <button class="nav-btn" data-view="passport">Passport</button>
          <button class="nav-btn" data-view="game-night">Game Night</button>
          <button class="nav-btn" data-view="tournaments">Tournaments</button>
          <button class="nav-btn" data-view="rewards">Rewards</button>
        </nav>

        <div class="passport-mini" id="passport-mini"></div>
      </header>

      <main id="main-screen"></main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
